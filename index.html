<script>
    function showPreview(event, previewId) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(previewId);
                img.src = e.target.result;
                img.style.display = "block";
            }
            reader.readAsDataURL(file);
        }
    }

    async function fetchApps() {
        try {
            const response = await fetch('/api/apps');
            const apps = await response.json();
            const appList = document.getElementById('appList');
            if (apps.length === 0) {
                appList.innerHTML = '<p style="text-align: center; color: #777;">Koi purana app nahi mila.</p>';
                return;
            }
            appList.innerHTML = apps.map(app => `
                <div class="app-card">
                    <div class="app-info">
                        <h4>📱 ${app.appName}</h4>
                        <p>${app.packageName}</p>
                    </div>
                    <div class="action-buttons">
                        <a href="${app.downloadUrl || '#'}" class="btn-install" target="_blank">⬇️ Install App</a>
                        <button class="btn-delete" onclick="deleteApp('${app._id}')">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {}
    }

    async function deleteApp(appId) {
        if(confirm("Kya aap sach mein is app history ko delete karna chahte hain?")) {
            await fetch(`/api/apps/${appId}`, { method: 'DELETE' });
            fetchApps(); 
        }
    }

    // NAYA WAIT AUR STATUS SYSTEM
    document.getElementById('buildForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        
        // 1. Button ko "Wait" mode mein daalein
        btn.innerHTML = "⏳ App Ban Raha Hai (3-5 Min Wait Karein)...";
        btn.style.backgroundColor = "#f39c12"; 
        btn.disabled = true;

        const formData = {
            appName: document.getElementById('appName').value,
            appUrl: document.getElementById('appUrl').value,
            packageName: document.getElementById('packageName').value,
            themeColor: document.getElementById('themeColor').value,
            splashColor: document.getElementById('splashColor').value,
            googleLoginEnabled: document.getElementById('googleLoginToggle').checked,
            downloadSystemEnabled: document.getElementById('downloadToggle').checked,
            appIconUrl: document.getElementById('iconPreview').src || "https://via.placeholder.com/512",
            splashLogoUrl: document.getElementById('splashPreview').src || "https://via.placeholder.com/512"
        };

        try {
            await fetch('/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            
            // 2. Build trigger hone ke baad Status Check button banayein
            btn.innerHTML = "👀 Live Status Dekhein (Pass / Failed)";
            btn.style.backgroundColor = "#3498db"; 
            btn.disabled = false;
            
            // Is button par click karte hi GitHub ka status page khulega
            btn.onclick = (event) => {
                event.preventDefault();
                window.open("https://github.com/chandchand1514-blip/My-App-Builder/actions", "_blank");
            };

            setTimeout(fetchApps, 3000); 
        } catch (error) {
            alert("❌ Server Error: Build fail ho gaya.");
            btn.innerText = "🚀 Build Master App";
            btn.style.backgroundColor = "#28a745";
            btn.disabled = false;
        }
    });

    window.onload = fetchApps;
</script>
