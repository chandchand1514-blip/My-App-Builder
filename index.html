<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional App Builder</title>
    <style>
        :root { --bg: #f4f7f6; --card-bg: #ffffff; --text: #333333; --border: #eeeeee; --input-bg: #ffffff; }
        body.dark-mode { --bg: #121212; --card-bg: #1e1e1e; --text: #f1f1f1; --border: #333333; --input-bg: #2a2a2a; }
        body { font-family: Arial, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
        .container { max-width: 600px; margin: auto; background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 1px solid var(--border); transition: 0.3s; }
        h2, h3 { text-align: center; color: var(--text); }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input[type="text"], input[type="url"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border); border-radius: 5px; box-sizing: border-box; background: var(--input-bg); color: var(--text); }
        input[type="color"] { width: 100%; height: 40px; border: none; margin-top: 5px; background: transparent; }
        .preview-img { max-width: 100px; max-height: 100px; margin-top: 10px; display: none; border-radius: 10px; }
        .toggle-container { display: flex; align-items: center; margin-top: 15px; }
        .toggle-container label { margin: 0 0 0 10px; font-weight: normal; }
        .btn { display: block; width: 100%; padding: 15px; background: #198754; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; text-align: center; }
        .btn:disabled { background: #f39c12; cursor: wait; }
        .app-list { margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 20px; max-height: 400px; overflow-y: auto; }
        .app-card { background: var(--bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .app-info h4 { margin: 0 0 5px 0; }
        .app-info p { margin: 0; color: #888; font-size: 13px; }
        .btn-install { background: #0d6efd; color: white; padding: 8px 12px; border:none; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 13px; display: block; text-align: center; margin-bottom: 5px; cursor:pointer;}
        .btn-delete { background: #dc3545; color: white; padding: 8px 12px; border:none; border-radius: 5px; font-weight: bold; font-size: 13px; cursor: pointer; width: 100%;}
        .flex-row { display: flex; gap: 10px; }
        .flex-col { flex: 1; }
        #themeToggle { padding: 5px 15px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<!-- MAIN HOME PAGE -->
<div class="container" id="mainPage">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>🚀 App Builder</h2>
        <button id="themeToggle" onclick="toggleTheme()">🌙 Night</button>
    </div>
    
    <div class="app-list">
        <h3>🔄 Aapke Banaye Hue Apps</h3>
        <div id="appList"><p style="text-align: center;">Loading...</p></div>
    </div>

    <h3>📱 Build New / Edit App</h3>
    <form id="buildForm">
        <label>App Ka Naam:</label>
        <input type="text" id="appName" placeholder="e.g. My Shop" required>
        <label>Website Ka Link (URL):</label>
        <input type="url" id="appUrl" placeholder="https://example.com" required>
        <label>1. App Icon:</label>
        <input type="file" accept="image/*" onchange="showPreview(event, 'iconPreview')">
        <img id="iconPreview" class="preview-img">
        <label>2. Splash Logo:</label>
        <input type="file" accept="image/*" onchange="showPreview(event, 'splashPreview')">
        <img id="splashPreview" class="preview-img">
        <div class="flex-row">
            <div class="flex-col"><label>Theme Color</label><input type="color" id="themeColor" value="#000000"></div>
            <div class="flex-col"><label>Splash Color</label><input type="color" id="splashColor" value="#ffffff"></div>
        </div>
        <label>Package Name (Zaroori Hai):</label>
        <input type="text" id="packageName" placeholder="com.my.app" required>
        <div class="toggle-container"><input type="checkbox" id="googleLoginToggle" checked><label>Google Login (Chrome Bypass) ON</label></div>
        <div class="toggle-container"><input type="checkbox" id="downloadToggle" checked><label>App Download System ON</label></div>
        <button type="submit" id="submitBtn" class="btn">🚀 Build Master App</button>
    </form>
</div>

<!-- NAYA DOWNLOAD PAGE (Hidden by default) -->
<div class="container" id="downloadPage" style="display:none; text-align:center; padding-top: 40px;">
    <button onclick="goBack()" style="float:left; padding:8px 15px; border-radius:5px; border:none; background:#6c757d; color:white; cursor:pointer;">🔙 Back</button>
    <div style="clear:both; margin-bottom:30px;"></div>
    
    <div style="font-size: 50px; margin-bottom:10px;">📱</div>
    <h1 id="dlAppName" style="margin-bottom: 5px;">App Name</h1>
    <p id="dlAppPkg" style="color: #888; margin-top: 0;">com.pkg</p>
    <p id="dlAppDate" style="font-size: 14px; font-weight:bold;">Date</p>
    
    <div style="margin: 40px 0;">
        <a id="dlAppBtn" href="#" class="btn" style="text-decoration:none; display:inline-block; font-size: 18px; padding: 15px 40px; background:#0d6efd;">📥 Download APK Now</a>
    </div>
    
    <p style="color:#198754; font-weight:bold;">✅ 100% Safe & Crash-Free Version</p>
</div>

<script>
    // Day / Night Theme Logic
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const btn = document.getElementById('themeToggle');
        if(document.body.classList.contains('dark-mode')) {
            btn.innerText = "☀️ Day";
            localStorage.setItem('theme', 'dark');
        } else {
            btn.innerText = "🌙 Night";
            localStorage.setItem('theme', 'light');
        }
    }
    
    if(localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').innerText = "☀️ Day";
    }

    // Naya Download Page Logic
    function openDownloadPage(name, pkg, date, url) {
        document.getElementById('mainPage').style.display = 'none';
        document.getElementById('downloadPage').style.display = 'block';
        document.getElementById('dlAppName').innerText = name;
        document.getElementById('dlAppPkg').innerText = pkg;
        document.getElementById('dlAppDate').innerText = "Built on: " + date;
        document.getElementById('dlAppBtn').href = url;
    }

    function goBack() {
        document.getElementById('downloadPage').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
    }

    function showPreview(event, previewId) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(previewId);
                img.src = e.target.result;
                img.style.display = "block";
            }
            reader.readAsDataURL(file);
        }
    }

    async function fetchApps() {
        try {
            const response = await fetch('/api/releases?t=' + new Date().getTime());
            const releases = await response.json();
            const appList = document.getElementById('appList');
            
            if (!releases || releases.length === 0) {
                appList.innerHTML = '<p style="text-align: center;">Koi app nahi mila.</p>';
                return 0;
            }

            appList.innerHTML = releases.map(release => {
                const titleParts = release.name ? release.name.split(" | ") : ["My App", "com.my.app"];
                const appName = titleParts[0];
                const pkgName = titleParts[1] || "com.universal.app";
                const apkAsset = release.assets && release.assets.find(a => a.name.endsWith('.apk'));
                const downloadUrl = apkAsset ? apkAsset.browser_download_url : release.html_url;
                const date = new Date(release.published_at).toLocaleDateString();

                return `
                    <div class="app-card" id="app-${release.id}">
                        <div class="app-info">
                            <h4>📱 ${appName}</h4>
                            <p>📦 ${pkgName}</p>
                            <p>📅 Date: ${date}</p>
                        </div>
                        <div>
                            <button onclick="openDownloadPage('${appName}', '${pkgName}', '${date}', '${downloadUrl}')" class="btn-install">⬇️ Install</button>
                            <button onclick="deleteApp(${release.id})" class="btn-delete">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
            return releases.length; 
        } catch (error) {
            document.getElementById('appList').innerHTML = '<p style="text-align: center;">App list load nahi ho payi.</p>';
            return 0;
        }
    }

    async function deleteApp(releaseId) {
        if(confirm("Kya aap sach mein is app ko delete karna chahte hain?")) {
            const appCard = document.getElementById(`app-${releaseId}`);
            appCard.style.opacity = "0.4"; 
            appCard.style.pointerEvents = "none";
            
            try {
                const response = await fetch(`/delete-app/${releaseId}`, { method: 'DELETE' });
                if(response.ok) { fetchApps(); } 
                else { alert("Delete fail ho gaya."); appCard.style.opacity = "1"; appCard.style.pointerEvents = "auto"; }
            } catch (error) { alert("Delete fail ho gaya."); appCard.style.opacity = "1"; appCard.style.pointerEvents = "auto"; }
        }
    }

    document.getElementById('buildForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const initialAppCount = await fetchApps();

        btn.innerHTML = "⏳ App Ban Raha Hai... (0:00)";
        btn.disabled = true;

        const formData = {
            appName: document.getElementById('appName').value,
            appUrl: document.getElementById('appUrl').value,
            packageName: document.getElementById('packageName').value,
            themeColor: document.getElementById('themeColor').value,
            splashColor: document.getElementById('splashColor').value,
            googleLoginEnabled: document.getElementById('googleLoginToggle').checked,
            downloadSystemEnabled: document.getElementById('downloadToggle').checked,
            appIconUrl: document.getElementById('iconPreview').src || "",
            splashLogoUrl: document.getElementById('splashPreview').src || ""
        };

        try {
            await fetch('/build', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) });
            let elapsedSeconds = 0;
            
            const timer = setInterval(async () => {
                elapsedSeconds++;
                const minutes = Math.floor(elapsedSeconds / 60);
                const seconds = elapsedSeconds % 60;
                btn.innerHTML = `⏳ App Ban Raha Hai... (${minutes}:${seconds < 10 ? '0' : ''}${seconds})`;

                if (elapsedSeconds % 10 === 0) {
                    try {
                        const checkResponse = await fetch('/api/releases?t=' + new Date().getTime());
                        if (checkResponse.ok) {
                            const currentReleases = await checkResponse.json();
                            if (currentReleases.length > initialAppCount) {
                                clearInterval(timer);
                                btn.innerHTML = "✅ App Ban Gaya! Upar List Mein Dekhein";
                                btn.style.backgroundColor = "#28a745";
                                fetchApps(); 
                                setTimeout(() => {
                                    btn.innerHTML = "🚀 Build Master App";
                                    btn.style.backgroundColor = "#198754";
                                    btn.disabled = false;
                                    document.getElementById('buildForm').reset();
                                    document.getElementById('iconPreview').style.display = 'none';
                                    document.getElementById('splashPreview').style.display = 'none';
                                }, 4000);
                            }
                        }
                    } catch (e) {}
                }
                
                if (elapsedSeconds > 300) {
                    clearInterval(timer);
                    btn.innerHTML = "⚠️ Thoda time lag raha hai, Page Refresh Karein";
                    btn.style.backgroundColor = "#f39c12";
                    btn.disabled = false;
                }
            }, 1000);
        } catch (error) {
            alert("❌ Server Error: Build trigger nahi hua.");
            btn.innerText = "🚀 Build Master App";
            btn.style.backgroundColor = "#198754";
            btn.disabled = false;
        }
    });

    window.onload = fetchApps;
</script>
</body>
</html>
