<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional App Builder</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 400px; 
            margin: 20px 0;
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        label { font-weight: bold; display: block; color: #555; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="url"], input[type="file"] { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        .color-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .color-group div {
            width: 48%;
        }
        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }
        .checkbox-group {
            margin-bottom: 20px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 10px;
            color: #333;
        }
        .checkbox-group label:last-child {
            margin-bottom: 0;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0 10px 0 0;
            transform: scale(1.2);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 Professional App Builder</h2>
        <form action="/build" method="POST" enctype="multipart/form-data">
            
            <label>App Ka Naam</label>
            <input type="text" name="appName" placeholder="Jaise: DesiStore App" required>

            <label>Website Ka Link (URL)</label>
            <input type="url" name="appUrl" placeholder="https://aapki-website.com" required>

            <label>App Ka Logo</label>
            <input type="file" name="appLogo" accept="image/png, image/jpeg" required>

            <label>Splash Logo</label>
            <input type="file" name="splashLogo" accept="image/png, image/jpeg">

            <div class="color-group">
                <div>
                    <label>Theme Color (Top Bar)</label>
                    <input type="color" name="themeColor" value="#ffffff">
                </div>
                <div>
                    <label>Splash Color</label>
                    <input type="color" name="splashColor" value="#ffffff">
                </div>
            </div>

            <label>Package Name (Zaroori Hai)</label>
            <input type="text" name="packageName" placeholder="com.app.builder" required>

            <!-- Chrome Login & Download ON/OFF Switches -->
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="enableChromeLogin" value="true" checked>
                    Google Login (Chrome Bypass) ON
                </label>
                <label>
                    <input type="checkbox" name="enableDownload" value="true" checked>
                    App Download System ON
                </label>
            </div>

            <button type="submit">Build Master App</button>
        </form>
    </div>

</body>
</html>
