<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional App Builder</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="url"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        input[type="file"] { margin-bottom: 5px; }
        .color-group { display: flex; gap: 15px; }
        .color-group div { flex: 1; }
        input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; }
        
        /* Modern Toggle Switch */
        .switch-container { display: flex; align-items: center; margin-bottom: 15px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; margin-right: 10px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4CAF50; }
        input:checked + .slider:before { transform: translateX(20px); }
        .switch-label { font-weight: bold; color: #555; }

        /* Image Preview */
        .preview-img { display: none; width: 80px; height: 80px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; object-fit: cover; }

        .btn-submit { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #218838; }
        
        /* App History Section */
        .app-history { margin-top: 30px; }
        .app-card { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .app-info h4 { margin: 0 0 5px 0; }
        .app-info p { margin: 0; font-size: 12px; color: #bdc3c7; }
        .action-buttons { display: flex; gap: 10px; }
        .btn-install { background-color: #2ecc71; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Professional App Builder</h2>

    <!-- App History Section -->
    <div class="app-history" id="appHistorySection">
        <h3 style="color: #333;">🔄 Aapke Purane Apps</h3>
        <div id="appList">
            <p style="text-align: center; color: #777;">Loading...</p>
        </div>
        <hr style="margin: 20px 0; border: 1px solid #eee;">
    </div>

    <!-- Build New App Form -->
    <h3 style="color: #333;">📱 Build New / Edit App</h3>
    <form id="buildForm">
        <div class="form-group">
            <label>App Ka Naam:</label>
            <input type="text" id="appName" placeholder="Ex: DesiStore" required>
        </div>

        <div class="form-group">
            <label>Website Ka Link (URL):</label>
            <input type="url" id="appUrl" placeholder="https://..." required>
        </div>

        <div class="form-group">
            <label>1. App Icon:</label>
            <input type="file" accept="image/*" onchange="showPreview(event, 'iconPreview')">
            <img id="iconPreview" class="preview-img">
        </div>

        <div class="form-group">
            <label>2. Splash Logo:</label>
            <input type="file" accept="image/*" onchange="showPreview(event, 'splashPreview')">
            <img id="splashPreview" class="preview-img">
        </div>

        <div class="form-group color-group">
            <div>
                <label>Theme Color (Top Bar)</label>
                <input type="color" id="themeColor" value="#000000">
            </div>
            <div>
                <label>Splash Color</label>
                <input type="color" id="splashColor" value="#000000">
            </div>
        </div>

        <div class="form-group">
            <label>Package Name (Zaroori Hai):</label>
            <input type="text" id="packageName" placeholder="com.aapka.app" required>
        </div>

        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="googleLoginToggle" checked>
                <span class="slider"></span>
            </label>
            <span class="switch-label">Google Login (Chrome Bypass) ON</span>
        </div>

        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="downloadToggle" checked>
                <span class="slider"></span>
            </label>
            <span class="switch-label">App Download System ON</span>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">🚀 Build Master App</button>
    </form>
</div>

<script>
    // Image Preview Function
    function showPreview(event, previewId) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById(previewId);
                img.src = e.target.result;
                img.style.display = "block";
            }
            reader.readAsDataURL(file);
        }
    }

    // Fetch and Display Past Apps
    async function fetchApps() {
        try {
            const response = await fetch('/api/apps');
            const apps = await response.json();
            const appList = document.getElementById('appList');
            
            if (apps.length === 0) {
                appList.innerHTML = '<p style="text-align: center; color: #777;">Koi purana app nahi mila.</p>';
                return;
            }

            appList.innerHTML = apps.map(app => `
                <div class="app-card">
                    <div class="app-info">
                        <h4>📱 ${app.appName}</h4>
                        <p>${app.packageName}</p>
                    </div>
                    <div class="action-buttons">
                        <a href="${app.downloadUrl || '#'}" class="btn-install" target="_blank">⬇️ Install App</a>
                        <button class="btn-delete" onclick="deleteApp('${app._id}')">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error("Error fetching apps:", error);
        }
    }

    // Delete App Function
    async function deleteApp(appId) {
        if(confirm("Kya aap sach mein is app history ko delete karna chahte hain?")) {
            try {
                const response = await fetch(`/api/apps/${appId}`, { method: 'DELETE' });
                if(response.ok) {
                    alert("App successfully delete ho gaya!");
                    fetchApps(); // List ko refresh karein
                } else {
                    alert("Delete karne mein problem aayi.");
                }
            } catch (error) {
                alert("Server error!");
            }
        }
    }

    // Form Submit Handler
    document.getElementById('buildForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "⏳ Building App (Please wait...)";
        btn.disabled = true;

        const formData = {
            appName: document.getElementById('appName').value,
            appUrl: document.getElementById('appUrl').value,
            packageName: document.getElementById('packageName').value,
            themeColor: document.getElementById('themeColor').value,
            splashColor: document.getElementById('splashColor').value,
            googleLoginEnabled: document.getElementById('googleLoginToggle').checked,
            downloadSystemEnabled: document.getElementById('downloadToggle').checked,
            appIconUrl: document.getElementById('iconPreview').src || "https://via.placeholder.com/512",
            splashLogoUrl: document.getElementById('splashPreview').src || "https://via.placeholder.com/512"
        };

        try {
            const response = await fetch('/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await response.json();
            alert(result.message || "Build Triggered Successfully!");
            
            // App list refresh karein taaki naya app dikh jaye
            setTimeout(fetchApps, 2000); 
        } catch (error) {
            alert("Error triggering build. Please check logs.");
        } finally {
            btn.innerText = "🚀 Build Master App";
            btn.disabled = false;
        }
    });

    // Page load hone par purane apps fetch karein
    window.onload = fetchApps;
</script>

</body>
</html>
