name: Build APK Engine

on:
  repository_dispatch:
    types: [build-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate App Code and Logo
        run: |
          mkdir -p app/src/main/java/com/myapp
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          curl -L "${{ github.event.client_payload.appLogoUrl }}" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "My-App-Builder"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android { namespace 'com.myapp'; compileSdk 34; defaultConfig { applicationId "com.myapp"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" } }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Permissions File mein hain, lekin user se tabhi maangenge jab zarurat hogi -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat << EOF > app/src/main/res/values/strings.xml
          <resources><string name="app_name">${{ github.event.client_payload.appName }}</string></resources>
          EOF
          
          cat << EOF > app/src/main/java/com/myapp/MainActivity.java
          package com.myapp;
          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;
          import java.util.List;
          
          public class MainActivity extends Activity {
              private PermissionRequest mPermissionRequest;
              private GeolocationPermissions.Callback mGeoCallback;
              private String mGeoOrigin;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  WebView webView = new WebView(this);
                  setContentView(webView);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setGeolocationEnabled(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  
                  webView.setWebChromeClient(new WebChromeClient() {
                      // Jab website kisi permission (Mic/Camera) ki maang karti hai
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              mPermissionRequest = request;
                              List<String> requestedPermissions = new ArrayList<>();
                              for (String resource : request.getResources()) {
                                  if (resource.equals(PermissionRequest.RESOURCE_AUDIO_CAPTURE)) {
                                      requestedPermissions.add(Manifest.permission.RECORD_AUDIO);
                                  } else if (resource.equals(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) {
                                      requestedPermissions.add(Manifest.permission.CAMERA);
                                  }
                              }
                              
                              if (!requestedPermissions.isEmpty()) {
                                  boolean allGranted = true;
                                  for (String p : requestedPermissions) {
                                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                                          allGranted = false; break;
                                      }
                                  }
                                  if (allGranted) {
                                      request.grant(request.getResources());
                                  } else {
                                      // Agar allow nahi hai, toh pop-up dikhao
                                      requestPermissions(requestedPermissions.toArray(new String[0]), 101);
                                  }
                              } else {
                                  request.grant(request.getResources());
                              }
                          } else {
                              request.grant(request.getResources());
                          }
                      }
                      
                      // Location maangne par pop-up
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                                  mGeoCallback = callback;
                                  mGeoOrigin = origin;
                                  requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 102);
                              } else {
                                  callback.invoke(origin, true, false);
                              }
                          } else {
                              callback.invoke(origin, true, false);
                          }
                      }
                  });
                  
                  webView.loadUrl("${{ github.event.client_payload.appUrl }}");
              }
              
              // Pop-up mein Allow dabane ke baad app ko chalne dena
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  if (requestCode == 101 && mPermissionRequest != null) {
                      boolean allGranted = true;
                      for (int result : grantResults) {
                          if (result != PackageManager.PERMISSION_GRANTED) {
                              allGranted = false; break;
                          }
                      }
                      if (allGranted) {
                          mPermissionRequest.grant(mPermissionRequest.getResources());
                      }
                      mPermissionRequest = null;
                  } else if (requestCode == 102 && mGeoCallback != null) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          mGeoCallback.invoke(mGeoOrigin, true, false);
                      } else {
                          mGeoCallback.invoke(mGeoOrigin, false, false);
                      }
                      mGeoCallback = null;
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Create Direct Download Link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.event.client_payload.buildId }}" app/build/outputs/apk/debug/app-debug.apk --title "App: ${{ github.event.client_payload.appName }}" --notes "Aapka Master App taiyar hai."
