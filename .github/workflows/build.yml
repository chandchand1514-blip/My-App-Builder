name: Build APK Engine

on:
  repository_dispatch:
    types: [build-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "master.keystore" ]; then
            keytool -genkey -v -keystore master.keystore -alias master_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass master123 -keypass master123 -dname "CN=AppBuilder, O=Company, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add master.keystore
            git commit -m "Added permanent keystore for seamless app updates"
            git push
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Image Converter
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Master App Code
        run: |
          RAW_PKG="${{ github.event.client_payload.config.packageName }}"
          PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:].')
          if [[ "$PKG" != *"."* ]] && [ -n "$PKG" ]; then PKG="com.${PKG}.app"; fi
          if [ -z "$PKG" ]; then PKG="com.universal.app"; fi
          PKG_DIR=$(echo "$PKG" | tr '.' '/')
          
          ADMOB_APP_ID="${{ github.event.client_payload.config.admobAppId }}"
          if [ -z "$ADMOB_APP_ID" ]; then ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"; fi
          
          ADMOB_BANNER_ID="${{ github.event.client_payload.config.admobBannerId }}"
          if [ -z "$ADMOB_BANNER_ID" ]; then ADMOB_BANNER_ID="ca-app-pub-3940256099942544/6300978111"; fi

          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          
          cp master.keystore app/master.keystore
          
          curl -L "${{ github.event.client_payload.appIconUrl }}" -o temp_icon.img
          convert temp_icon.img -resize 512x512 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          curl -L "${{ github.event.client_payload.splashLogoUrl }}" -o temp_splash.img
          convert temp_splash.img -resize 512x512 app/src/main/res/drawable/splash_logo.png
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "My-App-Builder"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          
          cat << EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace "$PKG"
              compileSdk 34
              signingConfigs {
                  release {
                      storeFile file("master.keystore")
                      storePassword "master123"
                      keyAlias "master_alias"
                      keyPassword "master123"
                  }
              }
              defaultConfig { 
                  applicationId "$PKG"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug { signingConfig signingConfigs.release }
                  release { signingConfig signingConfigs.release }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-ads:22.6.0'
              implementation 'com.onesignal:OneSignal:4.8.7'
          }
          EOF
          
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Reverted to stable permissions -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="\$ADMOB_APP_ID"/>
                  <activity android:name=".SplashActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="true" />
              </application>
          </manifest>
          EOF
          
          cat << EOF > app/src/main/res/values/strings.xml
          <resources><string name="app_name">${{ github.event.client_payload.appName }}</string></resources>
          EOF
          
          cat << 'EOF' > app/src/main/assets/no_internet.html
          <html><body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;text-align:center;background:#f8f9fa;">
          <div><h1 style="color:#d35400;">Loading Issue</h1><p>Website load nahi ho pa rahi hai. Kripya connection check karein.</p></div>
          </body></html>
          EOF
          
          cat << EOF > app/src/main/res/layout/activity_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="${{ github.event.client_payload.config.splashColor }}">
              <ImageView android:layout_width="250dp" android:layout_height="250dp" 
                  android:layout_centerInParent="true" android:src="@drawable/splash_logo" />
          </RelativeLayout>
          EOF
          
          cat << EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:ads="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="${{ github.event.client_payload.config.backgroundColor }}">
              <!-- Reverted to basic WebView setup without tricky hardware layers -->
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
              <com.google.android.gms.ads.AdView
                  android:id="@+id/adView" android:layout_width="match_parent" android:layout_height="wrap_content"
                  ads:adSize="BANNER" ads:adUnitId="\$ADMOB_BANNER_ID" />
          </LinearLayout>
          EOF
          
          cat << EOF > "app/src/main/java/$PKG_DIR/SplashActivity.java"
          package $PKG;
          import android.app.Activity; import android.content.Intent; import android.os.Bundle; import android.os.Handler; import android.os.Looper; import android.graphics.Color; import android.view.View;
          public class SplashActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState); 
                  try {
                      String colorHex = "${{ github.event.client_payload.config.splashColor }}";
                      int color = Color.parseColor(colorHex);
                      getWindow().setStatusBarColor(color);
                      double darkness = 1 - (0.299 * Color.red(color) + 0.587 * Color.green(color) + 0.114 * Color.blue(color)) / 255;
                      if (darkness < 0.5) { getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR); } 
                      else { getWindow().getDecorView().setSystemUiVisibility(0); }
                  } catch (Exception e) {}
                  setContentView(R.layout.activity_splash);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainActivity.class)); finish();
                  }, 2500);
              }
          }
          EOF
          
          cat << EOF > "app/src/main/java/$PKG_DIR/MainActivity.java"
          package $PKG;
          import android.Manifest; import android.app.Activity; import android.content.Intent; import android.content.pm.PackageManager; import android.os.Build; import android.os.Bundle; import android.webkit.GeolocationPermissions; import android.webkit.PermissionRequest; import android.webkit.WebChromeClient; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.CookieManager; import android.webkit.SslErrorHandler; import android.net.http.SslError; import java.util.ArrayList; import java.util.List; import android.graphics.Color; import android.view.View; import android.net.Uri; import android.webkit.ValueCallback; import android.provider.MediaStore; import java.io.File; import android.os.Environment;
          import com.google.android.gms.ads.MobileAds; import com.google.android.gms.ads.AdRequest; import com.google.android.gms.ads.AdView;
          import com.onesignal.OneSignal;
          import android.net.ConnectivityManager; import android.net.NetworkInfo; import android.content.Context;
          
          public class MainActivity extends Activity {
              private PermissionRequest mPermissionRequest; private GeolocationPermissions.Callback mGeoCallback; private String mGeoOrigin;
              private ValueCallback<Uri[]> mFilePathCallback; private final static int FILECHOOSER_RESULTCODE = 103;
              
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  // SAFE PERMISSION REQUEST
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      String[] reqPermissions = {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.CAMERA,
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      };
                      List<String> permsToRequest = new ArrayList<>();
                      for (String p : reqPermissions) {
                          if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) {
                              permsToRequest.add(p);
                          }
                      }
                      if (!permsToRequest.isEmpty()) {
                          requestPermissions(permsToRequest.toArray(new String[0]), 999);
                      }
                  }

                  try {
                      String colorHex = "${{ github.event.client_payload.config.themeColor }}";
                      int color = Color.parseColor(colorHex);
                      getWindow().setStatusBarColor(color);
                      double darkness = 1 - (0.299 * Color.red(color) + 0.587 * Color.green(color) + 0.114 * Color.blue(color)) / 255;
                      if (darkness < 0.5) { getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR); } 
                      else { getWindow().getDecorView().setSystemUiVisibility(0); }
                  } catch (Exception e) {}
                  
                  setContentView(R.layout.activity_main);
                  
                  OneSignal.initWithContext(this);
                  OneSignal.setAppId("${{ github.event.client_payload.config.onesignalAppId }}");
                  
                  MobileAds.initialize(this, initializationStatus -> {});
                  AdView mAdView = findViewById(R.id.adView);
                  AdRequest adRequest = new AdRequest.Builder().build();
                  mAdView.loadAd(adRequest);
                  
                  WebView webView = findViewById(R.id.webview);
                  
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true); 
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true); 
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setGeolocationEnabled(true);
                  webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webSettings.setUserAgentString("Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Mobile Safari/537.36");
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                          if(failingUrl.equals("${{ github.event.client_payload.appUrl }}")) {
                              view.loadUrl("file:///android_asset/no_internet.html");
                          }
                      }
                      @Override public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed(); 
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                      
                      @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                      
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (mFilePathCallback != null) { mFilePathCallback.onReceiveValue(null); }
                          mFilePathCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try { startActivityForResult(intent, FILECHOOSER_RESULTCODE); } 
                          catch (Exception e) { mFilePathCallback = null; return false; }
                          return true;
                      }
                  });
                  
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  NetworkInfo activeNetwork = cm.getActiveNetworkInfo();
                  if (activeNetwork != null && activeNetwork.isConnectedOrConnecting()) {
                      webView.loadUrl("${{ github.event.client_payload.appUrl }}");
                  } else {
                      webView.loadUrl("file:///android_asset/no_internet.html");
                  }
              }
              
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if(requestCode == FILECHOOSER_RESULTCODE) {
                      if (null == mFilePathCallback) return;
                      Uri[] result = WebChromeClient.FileChooserParams.parseResult(resultCode, intent);
                      mFilePathCallback.onReceiveValue(result);
                      mFilePathCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, intent);
              }
          }
          EOF

      - name: Build Android APK
        run: gradle assembleRelease

      - name: Create Direct Download Link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.event.client_payload.buildId }}" app/build/outputs/apk/release/app-release.apk --title "App: ${{ github.event.client_payload.appName }}" --notes "Reverted to Stable Base Code."
