name: Build APK Engine

on:
  repository_dispatch:
    types: [build-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "master.keystore" ]; then
            keytool -genkey -v -keystore master.keystore -alias master_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass master123 -keypass master123 -dname "CN=AppBuilder, O=Company, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add master.keystore
            git commit -m "Added permanent keystore for seamless app updates"
            git push
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Image Converter
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Master App Code
        run: |
          RAW_PKG="${{ github.event.client_payload.config.packageName }}"
          PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:].')
          if [[ "$PKG" != *"."* ]] && [ -n "$PKG" ]; then PKG="com.${PKG}.app"; fi
          if [ -z "$PKG" ]; then PKG="com.universal.app"; fi
          PKG_DIR=$(echo "$PKG" | tr '.' '/')

          THEME_COLOR="${{ github.event.client_payload.config.themeColor }}"
          if [ -z "$THEME_COLOR" ] || [ "$THEME_COLOR" == "" ] || [ "$THEME_COLOR" == "null" ]; then THEME_COLOR="#000000"; fi
          
          SPLASH_COLOR="${{ github.event.client_payload.config.splashColor }}"
          if [ -z "$SPLASH_COLOR" ] || [ "$SPLASH_COLOR" == "" ] || [ "$SPLASH_COLOR" == "null" ]; then SPLASH_COLOR="#ffffff"; fi
          
          BG_COLOR="${{ github.event.client_payload.config.backgroundColor }}"
          if [ -z "$BG_COLOR" ] || [ "$BG_COLOR" == "" ] || [ "$BG_COLOR" == "null" ]; then BG_COLOR="#ffffff"; fi

          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          
          cp master.keystore app/master.keystore
          
          curl -L "${{ github.event.client_payload.appIconUrl }}" -o temp_icon.img
          convert temp_icon.img -resize 512x512 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || echo "Image convert failed, continuing..."
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
          
          curl -L "${{ github.event.client_payload.splashLogoUrl }}" -o temp_splash.img
          convert temp_splash.img -resize 512x512 app/src/main/res/drawable/splash_logo.png || true
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "My-App-Builder"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          
          cat << EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace "$PKG"
              compileSdk 34
              signingConfigs {
                  release {
                      storeFile file("master.keystore")
                      storePassword "master123"
                      keyAlias "master_alias"
                      keyPassword "master123"
                  }
              }
              defaultConfig { 
                  applicationId "$PKG"
                  minSdk 24
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.${{ github.run_number }}"
              }
              buildTypes {
                  release { signingConfig signingConfigs.release; minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          
          cat << EOF > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">${SPLASH_COLOR}</item>
                  <item name="android:statusBarColor">${THEME_COLOR}</item>
              </style>
          </resources>
          EOF
          
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name" android:theme="@style/AppTheme" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".SplashActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize" android:launchMode="singleTask">
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="myappauth" android:host="callback" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat << EOF > app/src/main/res/values/strings.xml
          <resources><string name="app_name">${{ github.event.client_payload.appName }}</string></resources>
          EOF
          
          cat << EOF > app/src/main/res/layout/activity_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:background="${SPLASH_COLOR}">
              <ImageView android:layout_width="250dp" android:layout_height="250dp" 
                  android:layout_centerInParent="true" android:src="@drawable/splash_logo" />
          </RelativeLayout>
          EOF
          
          cat << EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/main_layout"
              android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="${BG_COLOR}">
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
          </LinearLayout>
          EOF
          
          cat << 'EOF' > "app/src/main/java/$PKG_DIR/SplashActivity.java"
          package XXXXX;
          import androidx.appcompat.app.AppCompatActivity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.graphics.Color;
          
          public class SplashActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try { getWindow().setStatusBarColor(Color.parseColor("YYYYY")); } catch (Exception e) {}
                  setContentView(R.layout.activity_splash);
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              startActivity(new Intent(SplashActivity.this, MainActivity.class));
                          } catch (Exception e) {}
                          finish();
                      }
                  }, 2500);
              }
          }
          EOF
          sed -i "s/XXXXX/$PKG/g" "app/src/main/java/$PKG_DIR/SplashActivity.java"
          sed -i "s/YYYYY/${SPLASH_COLOR}/g" "app/src/main/java/$PKG_DIR/SplashActivity.java"

          cat << 'EOF' > "app/src/main/java/$PKG_DIR/MainActivity.java"
          package XXXXX;
          import androidx.appcompat.app.AppCompatActivity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          
          public class MainActivity extends AppCompatActivity {
              private ValueCallback<Uri[]> mFilePathCallback;
              private final int FILECHOOSER_RESULTCODE = 103;
              private WebView webView;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      try { getWindow().setStatusBarColor(Color.parseColor("YYYYY")); } catch (Exception e) {}
                      setContentView(R.layout.activity_main);
                      
                      webView = findViewById(R.id.webview);
                      try { webView.setBackgroundColor(Color.parseColor("ZZZZZ")); } catch (Exception e) {}
                      
                      WebSettings ws = webView.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      ws.setDatabaseEnabled(true);
                      ws.setAllowFileAccess(true);
                      ws.setAllowContentAccess(true);
                      ws.setLoadWithOverviewMode(true);
                      ws.setUseWideViewPort(true);
                      
                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                      
                      webView.setWebViewClient(new WebViewClient() {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              if (url != null && (url.startsWith("intent://") || url.startsWith("whatsapp://") || url.startsWith("upi://") || url.startsWith("tel:") || url.startsWith("mailto:"))) {
                                  try {
                                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                                      return true;
                                  } catch (Exception e) { return false; }
                              }
                              return false;
                          }
                      });

                      webView.setDownloadListener(new DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                              try {
                                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                                  dm.enqueue(request);
                                  Toast.makeText(getApplicationContext(), "Downloading...", Toast.LENGTH_SHORT).show();
                              } catch (Exception e) {}
                          }
                      });

                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                              if (mFilePathCallback != null) {
                                  mFilePathCallback.onReceiveValue(null);
                              }
                              mFilePathCallback = filePathCallback;
                              try {
                                  startActivityForResult(fileChooserParams.createIntent(), FILECHOOSER_RESULTCODE);
                              } catch (Exception e) {
                                  mFilePathCallback = null;
                                  return false;
                              }
                              return true;
                          }
                      });
                      
                      handleIntent(getIntent());
                      
                  } catch (Exception e) {
                      Toast.makeText(this, "Loading...", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              private void handleIntent(Intent intent) {
                  if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction())) {
                      Uri data = intent.getData();
                      if (data != null && "myappauth".equals(data.getScheme()) && "callback".equals(data.getHost())) {
                          String token = data.getQueryParameter("token");
                          if (token != null && !token.isEmpty()) {
                              webView.evaluateJavascript("localStorage.setItem('auth_token', '" + token + "');", null);
                              webView.loadUrl("WWWWW?token=" + token);
                              return;
                          }
                      }
                  }
                  if (webView.getUrl() == null || webView.getUrl().isEmpty()) {
                      try { webView.loadUrl("WWWWW"); } catch (Exception e) {}
                  }
              }
              
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (mFilePathCallback != null) {
                          try {
                              mFilePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, intent));
                          } catch (Exception e) {}
                          mFilePathCallback = null;
                      }
                  }
                  super.onActivityResult(requestCode, resultCode, intent);
              }
          }
          EOF
          sed -i "s/XXXXX/$PKG/g" "app/src/main/java/$PKG_DIR/MainActivity.java"
          sed -i "s/YYYYY/${THEME_COLOR}/g" "app/src/main/java/$PKG_DIR/MainActivity.java"
          sed -i "s/ZZZZZ/${BG_COLOR}/g" "app/src/main/java/$PKG_DIR/MainActivity.java"
          sed -i "s|WWWWW|${{ github.event.client_payload.appUrl }}|g" "app/src/main/java/$PKG_DIR/MainActivity.java"

      - name: Build Android APK
        run: gradle assembleRelease

      - name: Create Direct Download Link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.event.client_payload.buildId }}" app/build/outputs/apk/release/app-release.apk --title "${{ github.event.client_payload.appName }} | ${{ github.event.client_payload.config.packageName }}" --notes "Version ${{ github.run_number }}. Native Android Java Build with Deep Linking enabled."
