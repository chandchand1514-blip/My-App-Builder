name: Build APK Engine

on:
  repository_dispatch:
    types: [build-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "master.keystore" ]; then
            keytool -genkey -v -keystore master.keystore -alias master_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass master123 -keypass master123 -dname "CN=AppBuilder, O=Company, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add master.keystore
            git commit -m "Added permanent keystore for seamless app updates"
            git push
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Image Converter
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Master App Code
        run: |
          RAW_PKG="${{ github.event.client_payload.config.packageName }}"
          PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:].')
          if [[ "$PKG" != *"."* ]] && [ -n "$PKG" ]; then PKG="com.${PKG}.app"; fi
          if [ -z "$PKG" ]; then PKG="com.universal.app"; fi
          PKG_DIR=$(echo "$PKG" | tr '.' '/')

          THEME_COLOR="${{ github.event.client_payload.config.themeColor }}"
          SPLASH_COLOR="${{ github.event.client_payload.config.splashColor }}"
          BG_COLOR="${{ github.event.client_payload.config.backgroundColor }}"

          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          
          cp master.keystore app/master.keystore
          
          # BULLETPROOF IMAGE SYSTEM (No more InflateException Crashes)
          curl -sL "${{ github.event.client_payload.appIconUrl }}" -o temp_icon.png
          convert temp_icon.png -resize 512x512 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || convert -size 512x512 canvas:"#198754" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          curl -sL "${{ github.event.client_payload.splashLogoUrl }}" -o temp_splash.png
          convert temp_splash.png -resize 512x512 app/src/main/res/drawable/splash_logo.png || convert -size 512x512 xc:transparent app/src/main/res/drawable/splash_logo.png
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "My-App-Builder"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          
          cat << EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace "$PKG"
              compileSdk 34
              signingConfigs { release { storeFile file("master.keystore"); storePassword "master123"; keyAlias "master_alias"; keyPassword "master123" } }
              defaultConfig { applicationId "$PKG"; minSdk 24; targetSdk 34; versionCode ${{ github.run_number }}; versionName "1.${{ github.run_number }}" }
              buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          
          # SECURE XML WRAPPER (Prevents syntax crashes)
          cat << EOF > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name"><![CDATA[${{ github.event.client_payload.appName }}]]></string>
              <string name="app_url"><![CDATA[${{ github.event.client_payload.appUrl }}]]></string>
          </resources>
          EOF
          
          cat << EOF > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:statusBarColor">@android:color/black</item>
              </style>
          </resources>
          EOF
          
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="@string/app_name" android:theme="@style/AppTheme" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".SplashActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize" />
              </application>
          </manifest>
          EOF
          
          cat << EOF > app/src/main/res/layout/activity_splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/splash_layout" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@android:color/white">
              <ImageView android:layout_width="250dp" android:layout_height="250dp" android:layout_centerInParent="true" android:src="@drawable/splash_logo" />
          </RelativeLayout>
          EOF
          
          cat << EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/main_layout" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="@android:color/white">
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
          </LinearLayout>
          EOF
          
          cat << EOF > "app/src/main/java/$PKG_DIR/SplashActivity.kt"
          package $PKG
          import androidx.appcompat.app.AppCompatActivity
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.graphics.Color
          import android.widget.RelativeLayout
          class SplashActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_splash)
                  
                  try { window.statusBarColor = Color.parseColor("${SPLASH_COLOR}") } catch (e: Exception) {}
                  try { findViewById<RelativeLayout>(R.id.splash_layout).setBackgroundColor(Color.parseColor("${SPLASH_COLOR}")) } catch (e: Exception) {}
                  
                  Handler(Looper.getMainLooper()).postDelayed({
                      try { startActivity(Intent(this, MainActivity::class.java)); finish() } catch (e: Exception) {}
                  }, 2500)
              }
          }
          EOF
          
          cat << EOF > "app/src/main/java/$PKG_DIR/MainActivity.kt"
          package $PKG
          import androidx.appcompat.app.AppCompatActivity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.*
          import android.graphics.Color
          import android.widget.LinearLayout
          import android.widget.Toast
          class MainActivity : AppCompatActivity() {
              private var mFilePathCallback: ValueCallback<Array<Uri>>? = null
              private val FILECHOOSER_RESULTCODE = 103
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  try { window.statusBarColor = Color.parseColor("${THEME_COLOR}") } catch (e: Exception) {}
                  try { findViewById<LinearLayout>(R.id.main_layout).setBackgroundColor(Color.parseColor("${BG_COLOR}")) } catch (e: Exception) {}
                  
                  val webView = findViewById<WebView>(R.id.webview)
                  try { webView.setBackgroundColor(Color.parseColor("${BG_COLOR}")) } catch (e: Exception) {}
                  
                  val ws = webView.settings
                  ws.javaScriptEnabled = true
                  ws.domStorageEnabled = true
                  ws.allowFileAccess = true
                  ws.allowContentAccess = true
                  ws.loadWithOverviewMode = true
                  ws.useWideViewPort = true
                  
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                          if (url != null && (url.contains("accounts.google.com") || url.contains("oauth") || url.startsWith("intent://"))) {
                              try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url))); return true } catch (e: Exception) {}
                          }
                          return false
                      }
                  }
                  
                  webView.setDownloadListener { url, _, contentDisposition, mimeType, _ ->
                      try {
                          val request = DownloadManager.Request(Uri.parse(url))
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, contentDisposition, mimeType))
                          (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(request)
                          Toast.makeText(applicationContext, "Downloading...", Toast.LENGTH_SHORT).show()
                      } catch (e: Exception) {}
                  }
                  
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(webView: WebView, filePathCallback: ValueCallback<Array<Uri>>, fileChooserParams: FileChooserParams): Boolean {
                          mFilePathCallback?.onReceiveValue(null)
                          mFilePathCallback = filePathCallback
                          try { startActivityForResult(fileChooserParams.createIntent(), FILECHOOSER_RESULTCODE) } catch (e: Exception) { return false }
                          return true
                      }
                  }
                  webView.loadUrl(getString(R.string.app_url))
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, intent: Intent?) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      mFilePathCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, intent))
                      mFilePathCallback = null
                  }
                  super.onActivityResult(requestCode, resultCode, intent)
              }
          }
          EOF

      - name: Build Android APK
        run: gradle assembleRelease

      - name: Create Direct Download Link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.event.client_payload.buildId }}" app/build/outputs/apk/release/app-release.apk --title "${{ github.event.client_payload.appName }} | ${{ github.event.client_payload.config.packageName }}" --notes "Version ${{ github.run_number }}. Pure CDATA & Canvas Protection."
