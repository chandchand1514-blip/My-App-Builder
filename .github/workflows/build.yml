name: Build APK Engine

on:
  repository_dispatch:
    types: [build-app]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Permanent Keystore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "master.keystore" ]; then
            keytool -genkey -v -keystore master.keystore -alias master_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass master123 -keypass master123 -dname "CN=AppBuilder, O=Company, C=IN"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add master.keystore
            git commit -m "Added permanent keystore"
            git push
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Install Image Converter
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Master App Code
        run: |
          RAW_PKG="${{ github.event.client_payload.packageName }}"
          PKG=$(echo "$RAW_PKG" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:].')
          if [[ "$PKG" != *"."* ]] && [ -n "$PKG" ]; then PKG="com.${PKG}.app"; fi
          if [ -z "$PKG" ]; then PKG="com.universal.app"; fi
          PKG_DIR=$(echo "$PKG" | tr '.' '/')

          THEME_COLOR="${{ github.event.client_payload.themeColor }}"
          if [ -z "$THEME_COLOR" ] || [ "$THEME_COLOR" == "" ] || [ "$THEME_COLOR" == "null" ]; then THEME_COLOR="#000000"; fi
          
          SPLASH_COLOR="${{ github.event.client_payload.splashColor }}"
          if [ -z "$SPLASH_COLOR" ] || [ "$SPLASH_COLOR" == "" ] || [ "$SPLASH_COLOR" == "null" ]; then SPLASH_COLOR="#ffffff"; fi

          mkdir -p "app/src/main/java/$PKG_DIR"
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          
          cp master.keystore app/master.keystore
          
          if [ -n "${{ github.event.client_payload.appIconUrl }}" ]; then
            curl -L "${{ github.event.client_payload.appIconUrl }}" -o temp_icon.img || true
            convert temp_icon.img -resize 512x512 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          fi
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "My-App-Builder"
          include ':app'
          EOF
          
          cat << EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android { 
              namespace "$PKG"
              compileSdk 34
              signingConfigs {
                  release {
                      storeFile file("master.keystore")
                      storePassword "master123"
                      keyAlias "master_alias"
                      keyPassword "master123"
                  }
              }
              defaultConfig { 
                  applicationId "$PKG"
                  minSdk 24
                  targetSdk 34
                  versionCode ${{ github.run_number }}
                  versionName "1.0"
              }
              buildTypes {
                  release { signingConfig signingConfigs.release; minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.browser:browser:1.7.0'
          }
          EOF
          
          cat << EOF > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">${SPLASH_COLOR}</item>
                  <item name="android:statusBarColor">${THEME_COLOR}</item>
              </style>
          </resources>
          EOF
          
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:theme="@style/AppTheme" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize" android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="myappauth" android:host="callback" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cat << EOF > app/src/main/res/values/strings.xml
          <resources><string name="app_name">${{ github.event.client_payload.appName }}</string></resources>
          EOF
          
          cat << EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical">
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
          </LinearLayout>
          EOF
          
          cat << 'EOF' > "app/src/main/java/$PKG_DIR/MainActivity.java"
          package XXXXX;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.browser.customtabs.CustomTabsIntent;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  webView = findViewById(R.id.webview);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
                  
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null && (url.contains("accounts.google.com") || url.contains("oauth"))) {
                              try {
                                  CustomTabsIntent customTabsIntent = new CustomTabsIntent.Builder().build();
                                  customTabsIntent.launchUrl(MainActivity.this, Uri.parse(url));
                                  return true;
                              } catch (Exception e) { return false; }
                          }
                          return false;
                      }
                  });

                  handleIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntent(intent);
              }

              private void handleIntent(Intent intent) {
                  if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction())) {
                      Uri data = intent.getData();
                      if (data != null && "myappauth".equals(data.getScheme()) && "callback".equals(data.getHost())) {
                          String token = data.getQueryParameter("token");
                          if (token != null) {
                              webView.evaluateJavascript("localStorage.setItem('auth_token', '" + token + "');", null);
                              webView.loadUrl("WWWWW?token=" + token);
                              return;
                          }
                      }
                  }
                  if (webView.getUrl() == null) {
                      webView.loadUrl("WWWWW");
                  }
              }
          }
          EOF
          sed -i "s/XXXXX/$PKG/g" "app/src/main/java/$PKG_DIR/MainActivity.java"
          sed -i "s|WWWWW|${{ github.event.client_payload.appUrl }}|g" "app/src/main/java/$PKG_DIR/MainActivity.java"

      - name: Build Android APK
        run: gradle assembleRelease

      - name: Create Direct Download Link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.event.client_payload.buildId || github.run_number }}" app/build/outputs/apk/release/app-release.apk --title "${{ github.event.client_payload.appName }} | ${{ github.event.client_payload.packageName }}" --notes "Auto-generated APK build."
